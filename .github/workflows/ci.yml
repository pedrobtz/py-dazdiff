name: CI

# Profiles (see .agents/roadmap.md, "CI policy"):
#   quick: lint + pytest on Ubuntu / Python 3.13. Pull requests.
#   full:  lint + pytest on 3 OSes x Python 3.10-3.14, lowest direct
#          dependencies, coverage, and a packaging smoke test.
#          Pushes to main, manual runs, and pull requests labelled `full-ci`.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
  workflow_dispatch:

# A pull request's superseded runs are cancelled; a push to main never is, so every
# merge commit gets a complete full-profile run (two quick merges used to cancel
# the first one's queued macOS jobs).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  UV_PYTHON_DOWNLOADS: automatic

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .

  quick:
    if: ${{ !(github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv run --frozen pytest

  test:
    if: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci') }}
    name: test (${{ matrix.os }}, ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        # macOS runners are scarce (jobs were cancelled unstarted, "not acquired by
        # Runner"), so macOS runs the oldest and newest Python only.
        exclude:
          - { os: macos-latest, python: "3.11" }
          - { os: macos-latest, python: "3.12" }
          - { os: macos-latest, python: "3.13" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv run --frozen pytest
      # The report on this platform's real stdout: on Windows a console that cannot
      # encode box-drawing characters must get the ASCII fallback, not a crash.
      - name: dazdiff --report on the examples
        shell: bash
        run: |
          set +e
          uv run --frozen dazdiff examples/benchmark.csv examples/stored.csv --by id,region --report
          status=$?
          set -e
          test "$status" -eq 1   # the example files differ

  lowest:
    if: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci') }}
    name: test (lowest direct dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.10"
      - run: uv run --resolution lowest-direct --isolated pytest
      - run: uv run --resolution lowest-direct --isolated python -c "import pandas; print('pandas', pandas.__version__)"

  coverage:
    if: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      # The floor is the level Stage 7 reached (98%), less a point of slack.
      - run: uv run --frozen pytest --cov=dazdiff --cov-report=term-missing --cov-fail-under=97

  package:
    if: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv build
      - run: uvx twine check --strict dist/*
      - name: sdist leaves out repository-only files
        run: |
          ! tar tzf dist/*.tar.gz | grep -E '/(\.agents|\.github)/'
      - name: installed CLI runs on the examples
        run: |
          uv venv /tmp/smoke
          uv pip install --python /tmp/smoke dist/*.whl
          /tmp/smoke/bin/dazdiff --version
          set +e
          /tmp/smoke/bin/dazdiff examples/benchmark.csv examples/stored.csv --by id,region --summary
          status=$?
          set -e
          test "$status" -eq 1   # the example files differ
