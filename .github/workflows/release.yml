name: Release

# Publishes with PyPI trusted publishing (no API tokens):
#   - manual run ("Run workflow"): build and upload to TestPyPI;
#   - a pushed tag v*: build, check the tag matches the version, upload to PyPI.
# Each index needs a trusted publisher for this repository, this workflow
# (release.yml) and the environment named below (testpypi / pypi).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_PYTHON_DOWNLOADS: automatic

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv build
      - run: uvx twine check --strict dist/*
      - name: the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(uvx --from toml-cli toml get --toml-path pyproject.toml project.version)
          test "v$version" = "$GITHUB_REF_NAME" || {
            echo "tag $GITHUB_REF_NAME does not match version $version"; exit 1; }
      - name: the built wheel runs the CLI on the examples
        run: |
          uv venv /tmp/smoke
          uv pip install --python /tmp/smoke dist/*.whl
          /tmp/smoke/bin/dazdiff --version
          set +e
          /tmp/smoke/bin/dazdiff examples/benchmark.csv examples/stored.csv --by id,region --report
          status=$?
          set -e
          test "$status" -eq 1   # the example files differ
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/dazdiff
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  pypi:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/dazdiff
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
