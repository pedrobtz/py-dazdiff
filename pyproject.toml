[project]
name = "dazdiff"
version = "0.1.0"
description = "Compare two tables value by value, from Python or the command line."
readme = "README.md"
authors = [
    { name = "pedrobtz", email = "pedrobtz@gmail.com" }
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2.2",
]
keywords = ["diff", "compare", "dataframe", "csv", "pandas", "testing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/pedrobtz/py-dazdiff"
Issues = "https://github.com/pedrobtz/py-dazdiff/issues"
Changelog = "https://github.com/pedrobtz/py-dazdiff/blob/main/CHANGELOG.md"

[project.scripts]
dazdiff = "dazdiff.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
exclude = [".agents", ".github", "CLAUDE.md", "uv.lock", ".python-version"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]  # line length is the formatter's job

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra"]
filterwarnings = ["error"]
